<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DG Bible Reading Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f5ef;--card:#fffdf9;--ink:#1e2a3b;--muted:#6a7280;--line:#e7dfd0;--navy:#1f3a5f;--navy2:#2c4d7c;--gold:#a8842f;--soft:#f1ece1;--ok:#2f6f4f;--warn:#9a5b13;--bad:#8c2f39;--serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131922;--card:#1a222e;--ink:#e8e4da;--muted:#98a1ae;--line:#2b3546;--navy:#8fb0dd;--navy2:#a9c3e8;--gold:#d2ad5c;--soft:#212b3a;--ok:#6cc39a;--warn:#e0a35a;--bad:#e58a93}}
:root[data-theme="dark"]{--bg:#131922;--card:#1a222e;--ink:#e8e4da;--muted:#98a1ae;--line:#2b3546;--navy:#8fb0dd;--navy2:#a9c3e8;--gold:#d2ad5c;--soft:#212b3a;--ok:#6cc39a;--warn:#e0a35a;--bad:#e58a93}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);padding:2rem 1.25rem 4rem}
.wrap{max-width:1120px;margin:0 auto}
header{text-align:center;padding:1rem 0 1.6rem}
.eyebrow{font-size:.72rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);font-weight:600}
h1{font:600 clamp(2.1rem,5vw,3rem)/1.1 var(--serif);margin:.4rem 0 .5rem;letter-spacing:.01em}
.verse{font:italic 500 1.1rem var(--serif);color:var(--muted)}
.rule{width:64px;height:2px;background:var(--gold);margin:1rem auto 0;border-radius:2px}
.tabs{display:flex;justify-content:center;gap:.25rem;background:var(--soft);border:1px solid var(--line);padding:.25rem;border-radius:999px;width:max-content;max-width:100%;margin:0 auto 1.6rem}
.tab{border:0;background:none;font:500 .88rem var(--sans);color:var(--muted);padding:.55rem 1.3rem;border-radius:999px;cursor:pointer}
.tab.on{background:var(--navy);color:var(--card)}
.grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:1.5rem;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.6rem;box-shadow:0 1px 2px rgba(30,42,59,.04),0 8px 24px rgba(30,42,59,.05)}
.card+.card{margin-top:1.5rem}
h2{font:600 1.55rem/1.2 var(--serif);margin-bottom:.2rem}
.sub{color:var(--muted);font-size:.85rem;margin-bottom:1.2rem}
label{display:block;font-size:.74rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:.9rem 0 .35rem}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.62rem .8rem}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
textarea{resize:vertical;min-height:60px}
.row{display:flex;gap:.7rem}.row>*{flex:1;min-width:0}
.btn{font:600 .88rem var(--sans);border:1px solid var(--navy);background:var(--navy);color:var(--card);border-radius:8px;padding:.7rem 1.2rem;cursor:pointer}
.btn:hover{background:var(--navy2)}
.btn.full{width:100%;margin-top:1.3rem}
.ghost{background:none;color:var(--navy);border-color:var(--line)}
.ghost:hover{background:var(--soft)}
.ghost.del{color:var(--bad)}
.small{padding:.4rem .8rem;font-size:.78rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:.2rem 0 1.4rem}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:.4rem .95rem;font:500 .82rem var(--sans);cursor:pointer}
.chip.on{border-color:var(--gold);background:var(--soft);box-shadow:inset 0 0 0 1px var(--gold)}
.bar{height:8px;background:var(--soft);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--gold));border-radius:8px;transition:width .35s}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:.9rem}
.pct{font:600 2.2rem/1 var(--serif);color:var(--navy)}
.today{border-left:3px solid var(--gold);background:var(--soft);padding:.8rem 1rem;border-radius:0 8px 8px 0;margin:1.2rem 0}
.today b{font:600 1.2rem var(--serif)}
.today small{display:block;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
.days{max-height:430px;overflow-y:auto;border:1px solid var(--line);border-radius:10px}
.day{display:flex;align-items:center;gap:.9rem;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:.7rem 1rem;font:inherit;color:var(--ink);cursor:pointer}
.day:last-child{border-bottom:0}.day:hover{background:var(--soft)}
.day .ck{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--muted);flex:none;display:grid;place-items:center;font-size:.72rem;color:var(--card)}
.day.done .ck{background:var(--ok);border-color:var(--ok)}
.day.done .rd{color:var(--muted);text-decoration:line-through}
.day .n{font-size:.72rem;color:var(--muted);width:3.4rem;flex:none;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.day .rd{flex:1;font-weight:500}.day .dt{font-size:.78rem;color:var(--muted)}
.day.now{box-shadow:inset 3px 0 0 var(--gold)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem 1.2rem}
.stat b{display:block;font:600 2rem/1.1 var(--serif);color:var(--navy)}
.stat span{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mem{padding:1.2rem 1.6rem}
.mem h3{font:600 1.35rem var(--serif);margin-bottom:.6rem}
.pl{padding:.8rem 0;border-top:1px solid var(--line);cursor:pointer}
.pl .top{display:flex;justify-content:space-between;gap:.8rem;flex-wrap:wrap;margin-bottom:.45rem;font-size:.9rem}
.pl .top span{color:var(--muted);font-size:.8rem}
.tag{font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:.15rem .6rem;border-radius:999px;border:1px solid currentColor;margin-left:.5rem;white-space:nowrap}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.mu{color:var(--muted)}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:.8rem}
.dots i{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);font:600 .66rem/24px var(--sans);text-align:center;font-style:normal;color:var(--muted)}
.dots i.d{background:var(--navy);border-color:var(--navy);color:var(--card)}
.empty{text-align:center;color:var(--muted);padding:2rem 1rem;border:1px dashed var(--line);border-radius:10px}
.note{font-size:.78rem;color:var(--muted);text-align:center;margin-top:1.5rem}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="eyebrow">Discipleship Group</div>
  <h1>Bible Reading Tracker</h1>
  <div class="verse">“Thy word is a lamp unto my feet, and a light unto my path.” — Psalm 119:105</div>
  <div class="rule"></div>
</header>

<nav class="tabs" id="tabs">
  <button class="tab on" data-tab="me">My Reading</button>
  <button class="tab hide" data-tab="leader" id="leaderTab">Leader Dashboard</button>
</nav>

<section id="meView" class="grid">
  <div>
    <div class="card">
      <h2>Create a Plan</h2>
      <p class="sub">Design a reading rhythm that fits your season.</p>
      <label for="mName">Your name</label>
      <input id="mName" placeholder="As your leader knows you" maxlength="60">
      <label for="pName">Plan title</label>
      <input id="pName" placeholder="e.g. The Gospel of John" maxlength="70">
      <label for="pBook">Book of the Bible</label>
      <select id="pBook"></select>
      <div class="row" id="rangeRow">
        <div><label for="pFrom">From chapter</label><input id="pFrom" type="number" min="1" value="1"></div>
        <div><label for="pTo">To chapter</label><input id="pTo" type="number" min="1" value="1"></div>
      </div>
      <div class="row">
        <div><label for="pDays">Days</label><input id="pDays" type="number" min="1" max="366" value="21"></div>
        <div><label for="pStart">Start date</label><input id="pStart" type="date"></div>
      </div>
      <label for="pNotes">Notes (optional)</label>
      <textarea id="pNotes" placeholder="Focus, prayer points, or questions to reflect on" maxlength="300"></textarea>
      <button class="btn full" id="create">Create Plan</button>
      <p class="sub" id="msg" style="margin:.8rem 0 0"></p>
    </div>
  </div>
  <div id="plansCol"></div>
</section>

<section id="leaderView" class="hide"></section>
<p class="note" id="note"></p>
</div>

<script>
const BOOKS=[["Genesis",50],["Exodus",40],["Leviticus",27],["Numbers",36],["Deuteronomy",34],["Joshua",24],["Judges",21],["Ruth",4],["1 Samuel",31],["2 Samuel",24],["1 Kings",22],["2 Kings",25],["1 Chronicles",29],["2 Chronicles",36],["Ezra",10],["Nehemiah",13],["Esther",10],["Job",42],["Psalms",150],["Proverbs",31],["Ecclesiastes",12],["Song of Solomon",8],["Isaiah",66],["Jeremiah",52],["Lamentations",5],["Ezekiel",48],["Daniel",12],["Hosea",14],["Joel",3],["Amos",9],["Obadiah",1],["Jonah",4],["Micah",7],["Nahum",3],["Habakkuk",3],["Zephaniah",3],["Haggai",2],["Zechariah",14],["Malachi",4],["Matthew",28],["Mark",16],["Luke",24],["John",21],["Acts",28],["Romans",16],["1 Corinthians",16],["2 Corinthians",13],["Galatians",6],["Ephesians",6],["Philippians",4],["Colossians",4],["1 Thessalonians",5],["2 Thessalonians",3],["1 Timothy",6],["2 Timothy",4],["Titus",3],["Philemon",1],["Hebrews",13],["James",5],["1 Peter",5],["2 Peter",3],["1 John",5],["2 John",1],["3 John",1],["Jude",1],["Revelation",22]];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={tab:'me',doc:{name:'',plans:[]},sel:null,members:[],open:{},del:null,db:null,uid:null,canEdit:false,ready:false};

function iso(d){const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function dayOf(p,i){const d=new Date(p.start+'T00:00');d.setDate(d.getDate()+i);return d}
function todayIdx(p){const a=new Date(p.start+'T00:00'),b=new Date();b.setHours(0,0,0,0);return Math.round((b-a)/864e5)}
function reading(p,i){
  if(!p.book)return 'Day '+(i+1)+' reading';
  const n=p.to-p.from+1,a=p.from+Math.floor(i*n/p.days),b=p.from+Math.floor((i+1)*n/p.days)-1;
  return b<a?'Rest & reflection':(a===b?`${p.book} ${a}`:`${p.book} ${a}–${b}`);
}
function portion(p){return p.book?(p.from===p.to?`${p.book} ${p.from}`:`${p.book} ${p.from}–${p.to}`):'Custom reading'}
function status(p){
  const done=p.done.length,t=todayIdx(p),exp=Math.max(0,Math.min(p.days,t+1));
  if(done>=p.days)return['Completed','ok'];
  if(t<0)return['Upcoming','mu'];
  const gap=exp-done;
  if(gap<=1)return['On track','ok'];
  return[`${gap} days behind`,gap>=4?'bad':'warn'];
}
const pct=p=>Math.round(p.done.length/p.days*100);

/* ---------- persistence ---------- */
let timer=null,saving=false,dirty=false;
function schedule(){clearTimeout(timer);timer=setTimeout(flush,350)}
async function flush(){
  dirty=true;if(saving)return;saving=true;
  while(dirty){dirty=false;
    try{
      const body={name:S.doc.name,plans:S.doc.plans,updated:Date.now()};
      if(S.db&&S.uid)await S.db.doc('members/'+S.uid).set(body);
      else try{localStorage.setItem('dg_tracker',JSON.stringify(body))}catch(e){}
    }catch(e){$('note').textContent='Your latest change could not be saved. Please try again.'}
  }
  saving=false;
}

/* ---------- my reading ---------- */
function renderMe(){
  const ps=S.doc.plans;
  if(!ps.length){$('plansCol').innerHTML='<div class="card"><div class="empty">No reading plan yet.<br>Create your first plan to begin your journey through Scripture.</div></div>';return}
  if(!ps.some(p=>p.id===S.sel))S.sel=ps[0].id;
  const p=ps.find(x=>x.id===S.sel),t=todayIdx(p),[st,cl]=status(p);
  const chips=ps.map(x=>`<button class="chip ${x.id===S.sel?'on':''}" data-sel="${x.id}">${esc(x.name)}</button>`).join('');
  let td='';
  if(p.done.length>=p.days)td='<div class="today"><small>Well done</small><b>You have completed this plan.</b></div>';
  else if(t<0)td=`<div class="today"><small>Begins</small><b>${dayOf(p,0).toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'})}</b></div>`;
  else{const i=Math.min(t,p.days-1);td=`<div class="today"><small>Today · Day ${i+1}</small><b>${esc(reading(p,i))}</b></div>`}
  const rows=Array.from({length:p.days},(_,i)=>{
    const d=p.done.includes(i);
    return `<button class="day ${d?'done':''} ${i===t?'now':''}" data-day="${i}"><span class="ck">${d?'✓':''}</span><span class="n">Day ${i+1}</span><span class="rd">${esc(reading(p,i))}</span><span class="dt">${dayOf(p,i).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span></button>`}).join('');
  $('plansCol').innerHTML=`<div class="chips">${chips}</div>
  <div class="card">
    <div class="head"><div><h2>${esc(p.name)}</h2><div class="sub" style="margin:0">${esc(portion(p))} · ${p.days} days<span class="tag ${cl}">${st}</span></div></div><div class="pct">${pct(p)}%</div></div>
    <div class="bar"><i style="width:${pct(p)}%"></i></div>
    <div class="sub" style="margin:.5rem 0 0">${p.done.length} of ${p.days} days completed</div>
    ${p.notes?`<div class="sub" style="margin:.8rem 0 0;font-style:italic">“${esc(p.notes)}”</div>`:''}
    ${td}
    <div class="days">${rows}</div>
    <div style="margin-top:1.1rem;text-align:right">${S.del===p.id?`<button class="btn ghost small del" data-del="${p.id}">Confirm delete</button> <button class="btn ghost small" data-cancel="1">Cancel</button>`:`<button class="btn ghost small del" data-del="${p.id}">Delete plan</button>`}</div>
  </div>`;
}

/* ---------- leader ---------- */
function renderLeader(){
  const ms=[...S.members].filter(m=>m.plans&&m.plans.length).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  const all=ms.flatMap(m=>m.plans),avg=all.length?Math.round(all.reduce((s,p)=>s+pct(p),0)/all.length):0;
  const needs=ms.filter(m=>m.plans.some(p=>status(p)[1]==='bad'||status(p)[1]==='warn')).length;
  let h=`<div class="stats"><div class="stat"><b>${ms.length}</b><span>Members reporting</span></div><div class="stat"><b>${all.length}</b><span>Active plans</span></div><div class="stat"><b>${avg}%</b><span>Average completion</span></div><div class="stat"><b>${needs}</b><span>Needing encouragement</span></div></div>`;
  if(!ms.length)h+='<div class="card"><div class="empty">No member has created a plan yet.<br>Progress will appear here as your group begins reading.</div></div>';
  ms.forEach(m=>{
    h+=`<div class="card mem"><h3>${esc(m.name||'Unnamed member')}</h3>`+m.plans.map(p=>{
      const k=m.id+'/'+p.id,[st,cl]=status(p);
      const dots=S.open[k]?`<div class="dots">${Array.from({length:p.days},(_,i)=>`<i class="${p.done.includes(i)?'d':''}" title="${esc(reading(p,i))}">${i+1}</i>`).join('')}</div>`:'';
      return `<div class="pl" data-open="${esc(k)}"><div class="top"><div><b>${esc(p.name)}</b><span class="tag ${cl}">${st}</span><br><span>${esc(portion(p))} · started ${dayOf(p,0).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span></div><div><b>${pct(p)}%</b> <span>${p.done.length}/${p.days} days</span></div></div><div class="bar"><i style="width:${pct(p)}%"></i></div>${dots}</div>`}).join('')+'</div>';
  });
  $('leaderView').innerHTML=h;
}

function setTab(t){
  S.tab=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  $('meView').classList.toggle('hide',t!=='me');
  $('leaderView').classList.toggle('hide',t!=='leader');
  if(t==='leader')renderLeader();
}

/* ---------- events ---------- */
function fillBook(){
  const b=BOOKS.find(x=>x[0]===$('pBook').value);
  $('rangeRow').classList.toggle('hide',!b);
  if(b){$('pFrom').max=b[1];$('pTo').max=b[1];$('pFrom').value=1;$('pTo').value=b[1]}
}
function create(){
  const msg=$('msg'),name=$('pName').value.trim(),days=parseInt($('pDays').value,10),start=$('pStart').value;
  const bk=BOOKS.find(x=>x[0]===$('pBook').value);
  let from=parseInt($('pFrom').value,10),to=parseInt($('pTo').value,10);
  if(!name)return msg.textContent='Please give your plan a title.';
  if(!(days>=1&&days<=366))return msg.textContent='Days must be between 1 and 366.';
  if(!start)return msg.textContent='Please choose a start date.';
  if(bk&&!(from>=1&&to>=from&&to<=bk[1]))return msg.textContent=`${bk[0]} has ${bk[1]} chapters; please check your range.`;
  S.doc.name=$('mName').value.trim()||S.doc.name;
  const p={id:'p'+Date.now().toString(36),name,days,start,notes:$('pNotes').value.trim(),done:[]};
  if(bk){p.book=bk[0];p.from=from;p.to=to}
  S.doc.plans.push(p);S.sel=p.id;msg.textContent='';
  $('pName').value='';$('pNotes').value='';
  schedule();renderMe();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-sel],[data-day],[data-del],[data-cancel],[data-open],#create');if(!t)return;
  if(t.dataset.tab)return setTab(t.dataset.tab);
  if(t.id==='create')return create();
  if(t.dataset.sel){S.sel=t.dataset.sel;S.del=null;return renderMe()}
  if(t.dataset.cancel){S.del=null;return renderMe()}
  if(t.dataset.del){
    if(S.del!==t.dataset.del){S.del=t.dataset.del;return renderMe()}
    S.doc.plans=S.doc.plans.filter(p=>p.id!==S.del);S.del=null;schedule();return renderMe();
  }
  if(t.dataset.day!==undefined){
    const p=S.doc.plans.find(x=>x.id===S.sel),i=+t.dataset.day,k=p.done.indexOf(i);
    k<0?p.done.push(i):p.done.splice(k,1);p.done.sort((a,b)=>a-b);
    schedule();const sc=document.querySelector('.days').scrollTop;renderMe();document.querySelector('.days').scrollTop=sc;return;
  }
  if(t.dataset.open){S.open[t.dataset.open]=!S.open[t.dataset.open];renderLeader()}
});
$('pBook').addEventListener('change',fillBook);
$('mName').addEventListener('change',()=>{S.doc.name=$('mName').value.trim();schedule()});

/* ---------- init ---------- */
(async function init(){
  $('pBook').innerHTML=BOOKS.map(b=>`<option>${b[0]}</option>`).join('')+'<option value="">Custom / topical reading</option>';
  $('pBook').value='John';fillBook();$('pStart').value=iso(new Date());
  let claude_=window.claude;
  try{
    const user=claude_?await claude_.use('user'):null;
    S.canEdit=user?await user.canEdit():false;
    S.uid=user?await user.id():null;
    S.db=claude_?await claude_.use('db'):null;
  }catch(e){}
  try{
    if(S.db&&S.uid){const s=await S.db.doc('members/'+S.uid).get();if(s.exists)S.doc=Object.assign({name:'',plans:[]},s.data())}
    else{const r=localStorage.getItem('dg_tracker');if(r)S.doc=JSON.parse(r)}
  }catch(e){}
  if(!Array.isArray(S.doc.plans))S.doc.plans=[];
  $('mName').value=S.doc.name||'';
  if(!(S.db&&S.uid))$('note').textContent='Sharing is not active in this view, so your progress is saved on this device only.';
  renderMe();
  if(S.db&&S.canEdit){
    $('leaderTab').classList.remove('hide');
    S.db.collection('members').onSnapshot(s=>{S.members=s.docs.map(d=>({id:d.id,...d.data()}));if(S.tab==='leader')renderLeader()},()=>{});
  }
})();
</script>
</body>
</html>
